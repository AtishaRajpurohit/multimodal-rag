[project]
name = "image-matching"
version = "0.1.0"
description = "Image matching for human faces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clip",
    "deepface==0.0.95",
    "dotenv>=0.9.9",
    "facenet-pytorch>=2.5.3",
    "geopy>=2.4.1",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "numpy==1.26.4",
    "onnxruntime>=1.22.1",
    "openai>=2.6.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.2",
    "piexif>=1.1.3",
    "pillow>=11.3.0",
    "pillow-heif>=0.13.0",
    "qdrant-client==1.11.3",
    "retina-face==0.0.17",
    "setuptools>=80.9.0",
    "streamlit>=1.50.0",
    "tensorflow==2.18.0",
    "tf-keras==2.18.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.56.1",
    "uuid>=1.30",
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }

